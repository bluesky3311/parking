<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外場停車場巡檢與簽到導航系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: {
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans antialiased selection:bg-amber-400 selection:text-slate-950">

    <!-- 頂部標題列 -->
    <header class="bg-surface-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-400 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-400/20">
                    🅿️
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wide text-white flex items-center gap-2">
                        外場巡檢簽到導航
                        <span id="syncStatusBadge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-400/20 text-amber-300 border border-amber-400/40">雲端同步中</span>
                    </h1>
                    <p class="text-xs text-slate-400">點擊即開・自動連動 Google 試算表</p>
                </div>
            </div>
            <button id="toggleManageBtn" type="button" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs flex items-center gap-1.5 transition active:scale-95 shadow-sm">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                <span>新增場地</span>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-1 space-y-6">

        <!-- 控制區塊：快速下拉選單 + 即時搜尋框 -->
        <section class="bg-surface-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-4">
            
            <!-- 1. 快速下拉選單與自動跳轉開關 -->
            <div class="space-y-2.5">
                <div class="flex items-center justify-between">
                    <label for="quickSelect" class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                        </svg>
                        <span>快速下拉選單</span>
                    </label>
                    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
                        <span class="text-xs text-slate-400">選取後自動跳轉</span>
                        <input type="checkbox" id="autoJumpToggle" class="sr-only peer" checked>
                        <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-400 relative"></div>
                    </label>
                </div>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <select id="quickSelect" class="w-full bg-surface-950 border border-slate-700 text-white font-medium rounded-xl px-3.5 py-3 appearance-none focus:outline-none focus:border-amber-400 transition pr-10 text-sm">
                            <option value="">-- 載入雲端場地中... --</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                            </svg>
                        </div>
                    </div>
                    <button type="button" id="quickGoBtn" class="px-4 py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold rounded-xl transition active:scale-95 shadow-md flex items-center justify-center shrink-0 text-sm">
                        開啟
                    </button>
                </div>
            </div>

            <!-- 2. 即時搜尋輸入框 -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                </div>
                <input type="text" id="searchInput" placeholder="輸入場地名稱或代碼快速篩選..." class="w-full bg-surface-950 border border-slate-700 text-white placeholder-slate-500 text-sm rounded-xl pl-10 pr-9 py-3 focus:outline-none focus:border-amber-400 transition">
                <button type="button" id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white hidden">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </section>

        <!-- 最近使用紀錄捷徑列 -->
        <section id="recentSection" class="hidden space-y-2">
            <div class="flex items-center justify-between px-1">
                <span class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    最近使用紀錄
                </span>
                <button type="button" id="clearRecentBtn" class="text-xs text-slate-400 hover:text-rose-400 transition">清除紀錄</button>
            </div>
            <div id="recentContainer" class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none"></div>
        </section>

        <!-- 場地清單卡片區 -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <span id="resultCount" class="text-xs font-bold uppercase tracking-wider text-slate-400">載入中...</span>
                <button type="button" id="refreshCloudBtn" class="text-xs text-amber-400 hover:underline flex items-center gap-1">
                    <span>🔄 重新整理雲端</span>
                </button>
            </div>

            <!-- 卡片網格 -->
            <div id="venueGrid" class="grid grid-cols-1 gap-3"></div>

            <!-- 無搜尋結果提示 -->
            <div id="emptyState" class="hidden py-12 text-center bg-surface-900 border border-slate-800 rounded-2xl p-6">
                <div class="text-3xl mb-2">🔍</div>
                <h3 class="text-base font-bold text-white">找不到符合的場地</h3>
                <p class="text-xs text-slate-400 mt-1">請嘗試其他關鍵字，或點擊上方「新增場地」加入自訂項目</p>
                <button type="button" id="emptyClearBtn" class="mt-4 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold transition">清除搜尋條件</button>
            </div>
        </section>
    </main>

    <!-- 新增場地滑出/彈出管理面板 -->
    <div id="managePanel" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-surface-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-black text-white flex items-center gap-2">
                    <span>➕ 新增場地至雲端試算表</span>
                </h3>
                <button type="button" id="closeManageBtn" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">✕</button>
            </div>

            <form id="addVenueForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">場地名稱 <span class="text-rose-400">*</span></label>
                    <input type="text" id="newVenueName" required placeholder="例如：安泰" class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">場地代碼 <span class="text-rose-400">*</span></label>
                    <input type="text" id="newVenueCode" required placeholder="例如：PSS_HB388" class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-amber-400 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">簽到網址 (選填，若留空將自動帶入標準格式)</label>
                    <input type="url" id="newVenueUrl" placeholder="https://..." class="w-full bg-surface-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:outline-none focus:border-amber-400 font-mono">
                </div>
                <div class="pt-2 flex gap-3">
                    <button type="button" id="closeManageBtn2" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-bold transition">取消</button>
                    <button type="submit" id="submitAddBtn" class="flex-1 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-sm font-black transition shadow-md">確認新增並同步</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 自訂確認彈窗 -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-surface-900 border border-slate-800 rounded-2xl max-w-xs w-full p-5 text-center space-y-4 shadow-2xl">
            <h4 id="confirmTitle" class="text-base font-black text-white">確認提示</h4>
            <p id="confirmMessage" class="text-xs text-slate-300"></p>
            <div class="flex gap-2 pt-1">
                <button type="button" id="confirmCancelBtn" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold">取消</button>
                <button type="button" id="confirmOkBtn" class="flex-1 py-2 rounded-xl bg-rose-500 hover:bg-rose-400 text-slate-950 text-xs font-black">確定</button>
            </div>
        </div>
    </div>

    <!-- 底部浮動 Toast 訊息 -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-2.5 transition-all duration-200 opacity-0 translate-y-3 pointer-events-none text-xs font-bold">
        <span id="toastIcon">✔</span>
        <span id="toastText">訊息通知</span>
    </div>

    <!-- JavaScript 核心程式 -->
    <script>
        // 您的 Google Apps Script 雲端部署網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwM79E8a07ZUrGToDMSgV9g9M1hv1hLHaY_mzmHI4iLJ4AxCaw0e708TZ6JlvmI1LamxA/exec";

        // 本地備用預設場地（當雲端無法連線時作為備援）
        const DEFAULT_VENUES = [
            { id: 'v1', name: '安泰', code: 'PSS_HB388', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB388/login' },
            { id: 'v2', name: '立民', code: 'PSS_HB229', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB229/login' },
            { id: 'v3', name: '常順', code: 'PSS_HB224', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB224/login' },
            { id: 'v4', name: '常德', code: 'PSS_HB225', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB225/login' },
            { id: 'v5', name: '運動公園', code: 'PSS_HB227', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB227/login' },
            { id: 'v6', name: '清豐', code: 'PSS_HB219', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB219/login' },
            { id: 'v7', name: '三山', code: 'PSS_HB228', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB228/login' },
            { id: 'v8', name: '加昌', code: 'PSS_HB223', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB223/login' },
            { id: 'v9', name: '後昌', code: 'PSS_HB220', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB220/login' },
            { id: 'v10', name: '樂群', code: 'PSS_HB222', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB222/login' },
            { id: 'v11', name: '惠民', code: 'PSS_HB226', url: 'https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB226/login' }
        ];

        const STORAGE_KEYS = {
            RECENT: 'pss_checkin_recent_v2',
            AUTO_JUMP: 'pss_checkin_autojump_v2'
        };

        // 應用程式狀態
        let venues = [];
        let recentIds = [];
        let searchQuery = '';
        let toastTimer = null;

        // DOM 元素
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const quickSelect = document.getElementById('quickSelect');
        const autoJumpToggle = document.getElementById('autoJumpToggle');
        const quickGoBtn = document.getElementById('quickGoBtn');
        const venueGrid = document.getElementById('venueGrid');
        const emptyState = document.getElementById('emptyState');
        const emptyClearBtn = document.getElementById('emptyClearBtn');
        const resultCount = document.getElementById('resultCount');
        const recentSection = document.getElementById('recentSection');
        const recentContainer = document.getElementById('recentContainer');
        const clearRecentBtn = document.getElementById('clearRecentBtn');
        const syncStatusBadge = document.getElementById('syncStatusBadge');

        const toggleManageBtn = document.getElementById('toggleManageBtn');
        const closeManageBtn = document.getElementById('closeManageBtn');
        const closeManageBtn2 = document.getElementById('closeManageBtn2');
        const managePanel = document.getElementById('managePanel');
        const addVenueForm = document.getElementById('addVenueForm');
        const newVenueName = document.getElementById('newVenueName');
        const newVenueCode = document.getElementById('newVenueCode');
        const newVenueUrl = document.getElementById('newVenueUrl');
        const refreshCloudBtn = document.getElementById('refreshCloudBtn');

        /**
         * 初始化
         */
        async function init() {
            loadLocalPreferences();
            await fetchVenuesFromCloud();
            bindEvents();
        }

        /**
         * 從 Google 試算表（雲端）載入資料
         */
        async function fetchVenuesFromCloud() {
            syncStatusBadge.textContent = '雲端同步中...';
            syncStatusBadge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-amber-400/20 text-amber-300 border border-amber-400/40 animate-pulse';
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('連線失敗');
                const data = await response.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    venues = data.map((item, index) => ({
                        id: 'cloud_' + index,
                        name: item.name,
                        code: item.code,
                        url: item.url
                    }));
                    syncStatusBadge.textContent = '已連線雲端';
                    syncStatusBadge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-400/20 text-emerald-300 border border-emerald-400/40';
                } else {
                    throw new Error('資料為空');
                }
            } catch (err) {
                console.warn('無法連線雲端試算表，改用預設清單', err);
                venues = [...DEFAULT_VENUES];
                syncStatusBadge.textContent = '離線/預設模式';
                syncStatusBadge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-rose-400/20 text-rose-300 border border-rose-400/40';
            }

            renderAll();
        }

        function loadLocalPreferences() {
            try {
                const savedRecent = localStorage.getItem(STORAGE_KEYS.RECENT);
                recentIds = savedRecent ? JSON.parse(savedRecent) : [];
            } catch (e) {
                recentIds = [];
            }

            try {
                const savedAutoJump = localStorage.getItem(STORAGE_KEYS.AUTO_JUMP);
                if (savedAutoJump !== null) {
                    autoJumpToggle.checked = savedAutoJump === 'true';
                }
            } catch (e) {
                autoJumpToggle.checked = true;
            }
        }

        function openVenueCheckIn(venue) {
            if (!venue) return;

            recentIds = [venue.id, ...recentIds.filter(id => id !== venue.id)].slice(0, 4);
            try {
                localStorage.setItem(STORAGE_KEYS.RECENT, JSON.stringify(recentIds));
            } catch (e) {}

            renderRecent();
            renderCards();

            window.open(venue.url, '_blank', 'noopener,noreferrer');
            showToast(`正在前往【${venue.name}】簽到系統`, '🚀');
        }

        function renderAll() {
            renderSelectOptions();
            renderRecent();
            renderCards();
        }

        function renderSelectOptions() {
            const currentVal = quickSelect.value;
            quickSelect.innerHTML = '<option value="">-- 請選擇場地直接前往 --</option>';

            venues.forEach((venue, index) => {
                const option = document.createElement('option');
                option.value = venue.id;
                option.textContent = `${index + 1}. ${venue.name}（${venue.code}）`;
                quickSelect.appendChild(option);
            });

            if (venues.some(v => v.id === currentVal)) {
                quickSelect.value = currentVal;
            }
        }

        function renderRecent() {
            const validRecents = recentIds
                .map(id => venues.find(v => v.id === id))
                .filter(Boolean);

            if (validRecents.length === 0) {
                recentSection.classList.add('hidden');
                return;
            }

            recentSection.classList.remove('hidden');
            recentContainer.innerHTML = '';

            validRecents.forEach((venue, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'px-3.5 py-2 rounded-xl bg-surface-900 hover:bg-amber-400 hover:text-slate-950 text-white border border-amber-400/60 font-bold text-sm flex items-center gap-1.5 transition active:scale-95 shadow-sm';
                btn.innerHTML = `
                    ${idx === 0 ? '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>' : ''}
                    <span>${escapeHtml(venue.name)}</span>
                    <span class="text-xs opacity-75 font-mono">${escapeHtml(venue.code.replace('PSS_', ''))}</span>
                `;
                btn.addEventListener('click', () => openVenueCheckIn(venue));
                recentContainer.appendChild(btn);
            });
        }

        function renderCards() {
            const keyword = searchQuery.trim().toLowerCase();
            const filtered = venues.filter(v => {
                if (!keyword) return true;
                return v.name.toLowerCase().includes(keyword) || v.code.toLowerCase().includes(keyword);
            });

            resultCount.textContent = `顯示 ${filtered.length} / ${venues.length} 個場地`;

            if (filtered.length === 0) {
                venueGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            venueGrid.innerHTML = '';

            const lastUsedId = recentIds[0];

            filtered.forEach((venue) => {
                const isLastUsed = venue.id === lastUsedId;
                const card = document.createElement('div');
                card.className = `group relative flex items-stretch rounded-2xl border-2 transition-all duration-150 overflow-hidden shadow-lg ${
                    isLastUsed
                        ? 'bg-slate-800/95 border-amber-400 shadow-amber-400/10'
                        : 'bg-surface-900 hover:bg-slate-800/90 border-slate-700 hover:border-amber-400/80'
                }`;

                const mainLink = document.createElement('a');
                mainLink.href = venue.url;
                mainLink.target = '_blank';
                mainLink.rel = 'noopener noreferrer';
                mainLink.className = 'flex-1 p-4 sm:p-5 flex items-center justify-between gap-3 cursor-pointer active:bg-slate-700/70 focus:outline-none';
                mainLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    openVenueCheckIn(venue);
                });

                mainLink.innerHTML = `
                    <div class="space-y-1.5 min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-2xl font-black text-white group-hover:text-amber-300 tracking-wide truncate">
                                ${escapeHtml(venue.name)}
                            </span>
                            ${isLastUsed ? '<span class="px-2 py-0.5 text-xs font-black rounded-md bg-amber-400 text-slate-950">最近使用</span>' : ''}
                        </div>
                        <div class="flex items-center gap-2 text-sm font-mono font-bold text-slate-300">
                            <span class="px-2 py-0.5 rounded bg-surface-950 border border-slate-700 text-amber-400">${escapeHtml(venue.code)}</span>
                        </div>
                    </div>
                    <div class="w-11 h-11 rounded-xl bg-amber-400 group-hover:bg-amber-300 text-slate-950 flex items-center justify-center shrink-0 shadow-md transition-transform group-hover:translate-x-0.5">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                        </svg>
                    </div>
                `;

                const actionCol = document.createElement('div');
                actionCol.className = 'flex flex-col border-l border-slate-700/80 bg-surface-950/60 divide-y divide-slate-800 shrink-0';

                const copyBtn = document.createElement('button');
                copyBtn.type = 'button';
                copyBtn.title = '複製簽到網址';
                copyBtn.className = 'flex-1 px-3.5 hover:bg-slate-800 active:bg-slate-700 text-slate-300 hover:text-amber-400 flex flex-col items-center justify-center gap-1 transition';
                copyBtn.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />
                    </svg>
                    <span class="text-[11px] font-bold">複製</span>
                `;
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyTextToClipboard(venue.url, `已複製【${venue.name}】簽到網址`);
                });
                actionCol.appendChild(copyBtn);

                card.appendChild(mainLink);
                card.appendChild(actionCol);
                venueGrid.appendChild(card);
            });
        }

        function bindEvents() {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                clearSearchBtn.classList.toggle('hidden', searchQuery.length === 0);
                renderCards();
            });

            const clearSearchHandler = () => {
                searchQuery = '';
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                searchInput.focus();
                renderCards();
            };
            clearSearchBtn.addEventListener('click', clearSearchHandler);
            emptyClearBtn.addEventListener('click', clearSearchHandler);

            quickSelect.addEventListener('change', () => {
                const selectedId = quickSelect.value;
                if (!selectedId) return;
                if (autoJumpToggle.checked) {
                    const venue = venues.find(v => v.id === selectedId);
                    if (venue) openVenueCheckIn(venue);
                }
            });

            quickGoBtn.addEventListener('click', () => {
                const selectedId = quickSelect.value;
                if (!selectedId) {
                    showToast('請先從下拉選單選擇一個場地', 'ℹ️');
                    quickSelect.focus();
                    return;
                }
                const venue = venues.find(v => v.id === selectedId);
                if (venue) openVenueCheckIn(venue);
            });

            autoJumpToggle.addEventListener('change', () => {
                try {
                    localStorage.setItem(STORAGE_KEYS.AUTO_JUMP, String(autoJumpToggle.checked));
                } catch (e) {}
                showToast(autoJumpToggle.checked ? '已開啟：選取場地自動跳轉' : '已關閉：選取後需按開啟按鈕', '⚙️');
            });

            clearRecentBtn.addEventListener('click', () => {
                recentIds = [];
                try {
                    localStorage.removeItem(STORAGE_KEYS.RECENT);
                } catch (e) {}
                renderRecent();
                renderCards();
                showToast('已清除最近使用紀錄', '🧹');
            });

            toggleManageBtn.addEventListener('click', () => {
                managePanel.classList.remove('hidden');
                newVenueName.focus();
            });
            const closeModal = () => managePanel.classList.add('hidden');
            closeManageBtn.addEventListener('click', closeModal);
            closeManageBtn2.addEventListener('click', closeModal);

            refreshCloudBtn.addEventListener('click', async () => {
                showToast('正在重新同步雲端資料...', '🔄');
                await fetchVenuesFromCloud();
                showToast('雲端資料已更新！', '✅');
            });

            // 新增場地並寫入 Google 試算表
            addVenueForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = newVenueName.value.trim();
                const code = newVenueCode.value.trim().toUpperCase();
                let url = newVenueUrl.value.trim();

                if (!name || !code) {
                    showToast('請填寫場地名稱與代碼', '⚠️');
                    return;
                }

                if (!url) {
                    url = `https://outsourced-signin.pss-group.xyz/check-in-system/${encodeURIComponent(code)}/login`;
                }

                showToast('正在同步寫入 Google 試算表...', '⏳');

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors', // 配合 Google Apps Script 重新導向
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "add", name, code, url })
                    });

                    // 重新抓取雲端最新資料
                    setTimeout(async () => {
                        await fetchVenuesFromCloud();
                        addVenueForm.reset();
                        managePanel.classList.add('hidden');
                        showToast(`已成功新增【${name}】至試算表！`, '✅');
                    }, 1500);

                } catch (err) {
                    showToast('寫入雲端失敗，請檢查網路連線', '❌');
                }
            });
        }

        function copyTextToClipboard(text, successMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg, '📋');
            } catch (err) {
                showToast('複製失敗', '⚠️');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function showToast(message, icon = '✔') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            toastText.textContent = message;
            toastIcon.textContent = icon;

            toast.classList.remove('opacity-0', 'translate-y-3');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-3');
            }, 2600);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
